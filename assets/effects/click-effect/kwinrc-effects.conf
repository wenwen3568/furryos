# FurryOS 交互动效层 —— 点击特效（kwinrc 侧，★ 生效权威位置 ★）
#
# 本文件是 kwinrc 的等效片段，是点击特效**唯一权威**的开关位置。
# 与 kdeglobals-effects.conf 同时存在不冲突（同一插件、同一开关），
# 但即使 kdeglobals 的 [Effects] Click 不生效，本文件也保证特效开启。
#
# ★★★ 关键事实（已用 deb 反查 + kwin 源码双重验证）★★★
# KWin 5.27 **不读** kdeglobals 的 [Effects] Click 键。
# 证据：
#   1) kwin 源码 src/effect/effectloader.cpp:56-58
#        KConfigGroup plugins(m_config, QStringLiteral("Plugins"));
#        const QString key = effectName + QStringLiteral("Enabled");
#      m_config 来自 src/main.cpp:83 → KSharedConfig::openConfig("kwinrc")；
#      src/effect/effecthandler.cpp:131
#        m_effectLoader->setConfig(kwinApp()->config()) → 也是 kwinrc。
#   2) 反查 libkwin.so.5.27.11 的 utf16 字符串：kdeglobals 只出现在
#      3 个组：Colors:Window、wayland（主题名）、localhost。
#      **没有任何 [Effects] 组或 Click 键**。
#   3) 特效 id 来自 kwin-data 的 metadata.json：
#      "Id": "mouseclick", "EnabledByDefault": false
#      → 内置、静态链接进 kwin_x11，无需额外安装包。
#
# 因此：mouseclickEnabled=true 是**必须**写入的那一行。
#
# 合并目标（由桌面视觉层成员二负责写入）：
#   /etc/skel/.config/kwinrc → [Plugins] mouseclickEnabled=true
#   /etc/skel/.config/kwinrc → [Effect-mouseclick] 配色段（外观权威位置）
#   /etc/xdg/kwinrc          → 同上（系统级默认，覆盖已存在用户）
#
# 动效参数依据 assets/brand/brand-tokens.md：
#   点击反馈 200–300ms → RingLife=250（涟漪存活时长，毫秒）
#   双层涟漪（RingCount=2）呼应 paw.svg 的四趾主次关系
#   线宽 3px 与 SDDM 主题按钮描边一致

[Plugins]
mouseclickEnabled=true

[Effect-mouseclick]
Color1=26,111,212
Color2=15,76,140
Color3=10,53,104
LineWidth=3
RingCount=2
RingLife=250
RingSize=32
ShowText=false
