# FurryOS 交互动效层 —— 点击特效启用配置片段（kdeglobals 侧）
#
# 本文件不是完整的 kdeglobals，而是「只含点击特效相关键」的片段。
# /etc/skel/.config/kdeglobals 的唯一负责人是桌面视觉层（成员二），
# 由他把下面 [Effects] 与 [Effect-mouseclick] 两个段合并进最终 kdeglobals。
#
# ★★★ 关键事实（已用 deb 反查 + kwin 源码双重验证，2026-10-24）★★★
# KWin 5.27 **不读** kdeglobals 的 [Effects] Click 键。
# 特效开关的唯一权威位置是 kwinrc：
#     ~/.config/kwinrc
#     [Plugins]
#     mouseclickEnabled=true
# 依据：
#   1) kwin 源码 src/effect/effectloader.cpp:56-58
#        KConfigGroup plugins(m_config, QStringLiteral("Plugins"));
#        const QString key = effectName + QStringLiteral("Enabled");
#      m_config 来自 src/main.cpp:83 → KSharedConfig::openConfig("kwinrc")；
#      src/effect/effecthandler.cpp:131
#        m_effectLoader->setConfig(kwinApp()->config()) → 也是 kwinrc。
#   2) 反查 libkwin.so.5.27.11 的 utf16 字符串：kdeglobals 只出现在
#      3 个组：Colors:Window、wayland（主题名）、localhost。
#      **没有任何 [Effects] 组或 Click 键**。
#   3) 特效 id 来自 kwin-data 的 metadata.json：
#      "Id": "mouseclick", "EnabledByDefault": false
#      → 内置、静态链接进 kwin_x11，无需额外安装包。
#
# 所以本文件的作用是：
#   - [Effects] Click=true：Plasma 5→6 演进中此键在 Plasma 6 才成为
#     KWin 读取的开关；此处写入属于「向后兼容 + 双保险」，无害但**不是
#     生效保证**。真正保证生效的是 assets/effects/click-effect/kwinrc-effects.conf。
#   - [Effect-mouseclick]：外观配色。kwin_mouseclick_config.so 的 utf16 字符串
#     同时包含 "Effect-mouseclick" 和 "kwinrc"，说明该 KCM 读写的是 kwinrc。
#     为稳妥起见，外观段**同时写两份**（kdeglobals + kwinrc），
#     两处都会被 KConfig 解析，取先读到的一份。
#
# 生效文件与键值（KWin 5.27.11 / Plasma 5.27 on Ubuntu 24.04 LTS noble）：
#   1) ~/.config/kwinrc
#        [Plugins]
#        mouseclickEnabled=true        ← 唯一权威开关
#   2) ~/.config/kwinrc 或 ~/.config/kdeglobals
#        [Effect-mouseclick]
#        Color1=26,111,212              ← 外观（左键涟漪色）
#        Color2=15,76,140
#        Color3=10,53,104
#        LineWidth=3 / RingCount=2 / RingLife=250 / RingSize=32 / ShowText=false
#   3) ~/.config/kdeglobals
#        [Effects]
#        Click=true                     ← 兼容层键，非生效保证
#
# 证据链：
#   - kwin-data_5.27.11-0ubuntu3 内置特效 metadata：
#     /usr/share/kwin/builtin-effects/kwin4_effect_mouseclick/metadata.json
#     → "Id": "mouseclick", "EnabledByDefault": false
#   - kwin 源码 src/effect/effectloader.cpp:58
#     key = effectName + "Enabled"，group = "Plugins"，file = kwinrc
#   - kcm libkcmkwincommon.so.5.27.11 反查字符串："kwinrc"、"Plugins"
#   - 特效外观配置组："Effect-mouseclick"（kwin_mouseclick_config.so 内字符串），
#     键 Color1/Color2/Color3/LineWidth/RingCount/RingLife/RingSize/ShowText
#
# 注意：本片段颜色值必须与 assets/brand/brand-tokens.md 保持一致。
#   左键   furryos-blue       #1A6FD4 → 26,111,212
#   中键   furryos-blue-dark  #0F4C8C → 15,76,140
#   右键   furryos-blue-deep  #0A3568 → 10,53,104

[Effects]
Click=true

[Effect-mouseclick]
Color1=26,111,212
Color2=15,76,140
Color3=10,53,104
LineWidth=3
RingCount=2
RingLife=250
RingSize=32
ShowText=false
