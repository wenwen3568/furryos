# FurryOS SDDM 配置片段（由登录体验层提供，成员五注入镜像）
#
# 目标路径：/etc/sddm.conf
# 作用：把 SDDM 的当前主题切换为 FurryOS 自定义主题。
# 冲突裁决（docs/CONTRACTS.md）：/etc/sddm.conf 由成员三（登录体验层）负责，
# 成员五在 live-build 中注入本文件，不得另行指定其它 Current= 值。
#
# 主题目录安装位置：/usr/share/sddm/themes/furryos/

[Theme]
# 当前启用的主题目录名（对应 /usr/share/sddm/themes/furryos）
Current=furryos

# 主题目录搜索路径（Debian/Ubuntu 默认值，显式声明以防被其它配置覆盖）
ThemeDir=/usr/share/sddm/themes

# 光标主题（保持与桌面一致；如镜像内未打包则忽略）
CursorTheme=Breeze_Snow

[General]
# 会话与用户模型：FurryOS 主题需要完整用户列表以支持用户名输入回退
Numlock=on
