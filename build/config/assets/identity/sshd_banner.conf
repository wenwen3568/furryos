# FurryOS SSH banner drop-in
# 安装位置：/etc/ssh/sshd_config.d/10-furryos-banner.conf
#
# 为什么需要这个文件：
#   openssh-server 上游模板 /usr/share/openssh/sshd_config 中 Banner 默认为
#   注释状态（#Banner none），并且该模板第 12 行有
#       Include /etc/ssh/sshd_config.d/*.conf
#   因此只要在 sshd_config.d 下放入一个 .conf drop-in，就能显式开启横幅，
#   无需改动 /etc/ssh/sshd_config 本体（避免与 openssh 包升级冲突）。
#
# 效果：远程 SSH 登录时，sshd 在认证前先打印 /etc/issue.net 的内容
#   （即 FurryOS 横幅），然后才进入认证流程。
#
# 注意：/etc/issue.net 内容本身绝不可含 Ubuntu 字样（见 assets/brand/brand-tokens.md）。

Banner /etc/issue.net
