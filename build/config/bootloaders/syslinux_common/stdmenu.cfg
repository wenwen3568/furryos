# FurryOS menu chrome - palette from assets/brand/brand-tokens.md
#   furryos-blue #1A6FD4, furryos-blue-deep #0A3568, white #FFFFFF
# Note: syslinux colours are #AARRGGBB (alpha first).
menu color title	* #FFFFFFFF *
menu color border	* #00000000 #00000000 none
menu color sel		* #FFFFFFFF #1A6FD4FF *
menu color hotsel	1;7;37;40 #FFFFFFFF #1A6FD4FF *
menu color timeout	* #FFFFFFFF #0A3568FF *
menu color timeout_msg	* #FFFFFFFF #0A3568FF *
menu color tabmsg	* #FFFFFFFF #00000000 *
menu color help		37;40 #FFD6E6F7 #00000000 none
menu vshift 12
menu rows 10
menu helpmsgrow 15
# The command line must be at least one line from the bottom.
menu cmdlinerow 16
menu timeoutrow 16
menu tabmsgrow 18
menu tabmsg Press ENTER to boot FurryOS or TAB to edit a menu entry
