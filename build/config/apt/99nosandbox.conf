// FurryOS live-build apt configuration.
//
// The build host mounts /root/furryos with the nodev option. apt normally
// drops privileges to the _apt user before running its helper binaries
// (including /usr/bin/apt-key for keyring handling). That user cannot see the
// bind-mounted /dev devices, so `command -v gpgv >/dev/null` inside apt-key
// fails with "cannot create /dev/null" and apt aborts with
// "gpgv, gpgv2 or gpgv1 required for verification".
//
// Running apt's helpers as root keeps /dev reachable. This only affects the
// build chroot, not the installed system.
APT::Sandbox::User "root";
